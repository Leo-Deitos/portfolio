/* ==================================================================
   TELA FIXA - 1280x720, como a pagina do Power BI.

   Todo o desenho (molduras, placas, painel ambar, icones da lateral)
   vem do SVG de fundo, que e o MESMO arquivo usado no relatorio. O que
   esta aqui em HTML e so o conteudo: numeros, rotulos e graficos, cada
   um na coordenada exata lida do PBIR.

   A tela nao reflui - ela escala. E a mesma limitacao do Power BI.
   ================================================================== */

html,body{margin:0;padding:0;background:#0B0906;height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color:var(--texto);display:grid;place-items:start center;overflow-x:hidden;
}

/* --------------------------------------------------------- filtros */
.slicer{
  display:flex;align-items:center;height:26px;width:100%;
  background:var(--escuro);border:1px solid #4A4034;border-radius:3px;
  color:var(--texto);font-size:11px;padding:0 6px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--texto2) 50%),
                   linear-gradient(135deg,var(--texto2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 11px,calc(100% - 9px) 11px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.slicer:focus{outline:1px solid var(--acento)}

/* --------------------------------------------------------- cartoes */
.kpi-rot{font-size:11.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase}
.kpi-val{font-size:25px;font-weight:600;letter-spacing:-.4px;margin-top:6px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.kpi-ly{font-size:10px;font-weight:600;color:var(--texto2);margin-top:14px;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.kpi-ly b{color:var(--texto);font-weight:700;font-variant-numeric:tabular-nums}
.selo{padding:0 5px;border-radius:3px;color:var(--escuro);font-weight:700;
  background:var(--positivo);font-size:9.5px}
.selo.desce{background:var(--negativo)}
.mini-leg{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--texto2)}

/* ----------------------------------------------- titulos dinamicos */
.titulo-din{font-size:11px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;color:var(--texto);display:flex;align-items:center}

/* ------------------------------------------------- top vendedores */
.vend{display:flex;align-items:center;gap:11px;height:56px;color:var(--escuro)}
.vend .pos{width:21px;height:21px;border-radius:50%;flex:none;display:grid;
  place-items:center;font-size:10.5px;font-weight:700;background:rgba(26,21,16,.16)}
.vend img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;
  border:1.5px solid rgba(26,21,16,.2);background:rgba(26,21,16,.08)}
.vend .nome{flex:1;font-size:13px;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.vend .num{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ------------------------------------------------------- navegacao */
.nav-caixa{position:absolute;cursor:pointer;border-radius:12px}
.nav-caixa:hover{background:rgba(245,166,35,.10)}
.nav-caixa:focus-visible{outline:2px solid var(--acento);outline-offset:1px}

.rotulo-eixo{fill:var(--texto3);font-size:9.5px;
  font-family:"Segoe UI",system-ui,Arial,sans-serif}
.aviso-mobile{display:none}
@media(max-width:760px){
  .aviso-mobile{display:block;color:var(--texto3);font-size:12px;
    padding:14px 18px;text-align:center;line-height:1.5}
}
</style>

<script>
"use strict";
const D = JSON.parse(document.getElementById("vendas1-data").textContent);

/* ====================================================================
   MOTOR - agregacao direta sobre a fato.
   Cada linha e [grupo, vendedor, periodo, faturamento, custo].
   ==================================================================== */
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const anoDe = D.periodos.map(am => Math.floor(am / 100));
const mesDe = D.periodos.map(am => am % 100);
const periodoLY = D.periodos.map(am =>
  D.periodos.indexOf((Math.floor(am / 100) - 1) * 100 + (am % 100)));
const linhas = [...new Set(D.dim.grupo.map(g => g.linha))].sort();

const MEDIDAS = [
  { nome: "Faturamento",    campo: "fat",    fmt: v => moeda(v) },
  { nome: "Margem Bruta",   campo: "margem", fmt: v => moeda(v) },
];

const F = { ano: String(D.meta.anos[D.meta.anos.length - 1]),
            mes: "T", linha: "T", medida: 0 };

const fmtM = new Intl.NumberFormat("pt-BR",
  { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const fmtI = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
const moeda = v => fmtM.format(v || 0);
const inteiro = v => fmtI.format(Math.round(v || 0));

function compacto(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return "R$ " + (v / 1e6).toFixed(1).replace(".", ",") + " Mi";
  if (a >= 1e3) return "R$ " + (v / 1e3).toFixed(0) + " Mil";
  return moeda(v);
}

/** Periodos que passam no filtro de ano e mes. `ly` desloca um ano. */
function periodos(ly) {
  const ps = [];
  D.periodos.forEach((am, i) => {
    if (F.ano !== "todos" && anoDe[i] !== Number(F.ano)) return;
    if (F.mes !== "T" && mesDe[i] !== Number(F.mes)) return;
    ps.push(i);
  });
  if (!ly) return ps;
  return ps.map(i => periodoLY[i]).filter(i => i >= 0);
}

/** Agrega a fato por uma chave. `lista` sobrepoe o filtro de periodo,
    o que permite calcular o ano anterior sem mexer em F. */
function agregar(por, ly, lista) {
  const ps = new Set(lista || periodos(ly));
  const fLinha = F.linha === "T" ? null : F.linha;
  const acc = new Map();
  for (const [g, v, p, fat, custo] of D.fato) {
    if (!ps.has(p)) continue;
    if (fLinha && D.dim.grupo[g].linha !== fLinha) continue;
    const k = por === "periodo" ? p : por === "grupo" ? g : por === "vendedor" ? v : 0;
    let a = acc.get(k);
    if (!a) acc.set(k, a = { fat: 0, custo: 0, margem: 0 });
    a.fat += fat; a.custo += custo; a.margem += fat - custo;
  }
  return acc;
}

function totais(ly) {
  const a = agregar("total", ly).get(0);
  return a || { fat: 0, custo: 0, margem: 0 };
}

/** Notas emitidas: contagem de NFes distintas, pre-calculada no JSON. */
function notas(ly) {
  const bloco = D.notas.total[F.linha] || D.notas.total["T"] || {};
  const ps = periodos(ly);
  if (F.ano !== "todos" && F.mes === "T") {
    const ano = ly ? Number(F.ano) - 1 : Number(F.ano);
    const v = bloco["a" + ano];
    if (v != null) return v;
  }
  if (F.ano === "todos" && F.mes === "T" && !ly) return bloco["TT"] || 0;
  return ps.reduce((s, p) => s + (bloco[String(p)] || 0), 0);
}

const temLY = () => periodos(true).length > 0;

/* ====================================================================
   DESENHO - cada funcao devolve um SVG do tamanho exato da caixa
   ==================================================================== */
function svg(w, h, filhos) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 " + w + " " + h);
  s.setAttribute("width", w); s.setAttribute("height", h);
  filhos.filter(Boolean).forEach(f => s.appendChild(f));
  return s;
}
function no(tag, attrs, texto) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (texto != null) e.textContent = texto;
  return e;
}
function div(cls, estilo, texto) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  if (estilo) d.setAttribute("style", estilo);
  if (texto != null) d.textContent = texto;
  return d;
}

/** Barras horizontais com rotulo a esquerda e valor a direita. */
function barrasH(w, h, itens) {
  const alt = 24, mE = 108, mD = 62;
  const iL = w - mE - mD;
  const max = Math.max(...itens.map(i => i.valor), 1);
  const g = [];
  itens.forEach((it, i) => {
    const y = i * alt + 4;
    g.push(no("text", { x: mE - 8, y: y + 12, class: "rotulo-eixo",
      "text-anchor": "end" }, it.rotulo));
    g.push(no("rect", { x: mE, y: y + 2, width: Math.max(it.valor / max * iL, 2),
      height: 13, rx: 2, fill: "var(--barra)" }));
    g.push(no("text", { x: mE + Math.max(it.valor / max * iL, 2) + 7, y: y + 13,
      class: "rotulo-eixo" }, compacto(it.valor)));
  });
  return svg(w, h, g);
}

/** Colunas do periodo + linha tracejada do ano anterior, como no BI. */
function combo(w, h, rotulos, colunas, linha) {
  const mE = 52, mD = 8, mT = 10, mB = 22;
  const iL = w - mE - mD, iA = h - mT - mB;
  const max = Math.max(...colunas, ...(linha || [0]), 1);
  const esc = v => iA - (v / max) * iA;
  const passo = iL / Math.max(colunas.length, 1);
  const g = [];

  for (let i = 0; i <= 2; i++) {
    const y = mT + iA - (iA / 2) * i;
    g.push(no("line", { x1: mE, y1: y, x2: mE + iL, y2: y,
      stroke: "rgba(150,140,121,.22)", "stroke-width": 1 }));
    g.push(no("text", { x: mE - 8, y: y + 3.5, class: "rotulo-eixo",
      "text-anchor": "end" }, compacto(max / 2 * i)));
  }
  colunas.forEach((v, i) => {
    const x = mE + passo * i + passo * 0.18;
    const y = mT + esc(v);
    g.push(no("rect", { x, y, width: passo * 0.64, height: Math.max(mT + iA - y, 1),
      rx: 1.5, fill: "var(--barra)" }));
    g.push(no("text", { x: mE + passo * i + passo / 2, y: h - 7,
      class: "rotulo-eixo", "text-anchor": "middle" }, rotulos[i]));
  });
  if (linha) {
    const pts = linha.map((v, i) =>
      (mE + passo * i + passo / 2) + "," + (mT + esc(v))).join(" ");
    g.push(no("polyline", { points: pts, fill: "none", stroke: "var(--texto)",
      "stroke-width": 1.6, "stroke-dasharray": "5 4" }));
    linha.forEach((v, i) => g.push(no("circle", {
      cx: mE + passo * i + passo / 2, cy: mT + esc(v), r: 3,
      fill: "var(--texto)" })));
  }
  return svg(w, h, g);
}

/** Mini barra "vs ano anterior": barra do atual, tracejado no anterior. */
function miniBarra(w, h, atual, anterior) {
  const g = [];
  const y = h - 34, alt = 15;
  const teto = Math.max(atual, anterior || 0) * 1.14 || 1;
  g.push(no("rect", { x: 0, y, width: Math.max(atual / teto * w, 2), height: alt,
    rx: 2, fill: "var(--acento)" }));
  if (anterior > 0) {
    const x = anterior / teto * w;
    g.push(no("line", { x1: x, y1: y - 5, x2: x, y2: y + alt + 5,
      stroke: "var(--texto2)", "stroke-width": 1.6, "stroke-dasharray": "3 3" }));
  }
  return svg(w, h, g);
}

/* ====================================================================
   MONTAGEM DA TELA - coordenadas lidas do PBIR
   ==================================================================== */
const TELA = document.getElementById("tela");

/** Posiciona um elemento na caixa exata do relatorio. */
function caixa(x, y, w, h, conteudo, cls) {
  const d = div("el " + (cls || ""),
    "left:" + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + "px");
  (Array.isArray(conteudo) ? conteudo : [conteudo])
    .filter(Boolean).forEach(c => d.appendChild(c));
  TELA.appendChild(d);
  return d;
}

function seletor(x, y, w, h, opcoes, valor, aoMudar) {
  const s = document.createElement("select");
  s.className = "slicer";
  opcoes.forEach(([v, r]) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = r; o.selected = String(v) === String(valor);
    s.appendChild(o);
  });
  s.addEventListener("change", () => { aoMudar(s.value); desenhar(); });
  caixa(x, y, w, h, s);
}

function cartao(x, y, w, h, rotulo, valor, atual, anterior, fmt) {
  // "FATURAMENTO", "MARGEM BRUTA" e "NOTAS EMITIDAS" ja estao desenhados
  // no SVG de fundo - repetir aqui gerava o rotulo dobrado.
  const filhos = [div("kpi-val", null, valor)];
  if (anterior > 0) {
    const pct = (atual - anterior) / anterior;
    const ly = div("kpi-ly");
    ly.appendChild(div(null, null, "Ano Anterior"));
    const b = document.createElement("b"); b.textContent = fmt(anterior);
    ly.appendChild(b);
    const se = div("selo" + (pct < 0 ? " desce" : ""), null,
      (pct < 0 ? "\u21E3 " : "\u21E1 ") + Math.abs(pct * 100).toFixed(0) + "%");
    ly.appendChild(se);
    filhos.push(ly);
  }
  caixa(x + 18, y + 40, w - 36, h - 46, filhos);
}

function desenhar() {
  TELA.textContent = "";

  // ---------------------------------------------------- fundo do BI
  // (vem do CSS; aqui so entram os elementos por cima)

  // -------------------------------------------------------- filtros
  seletor(616, 46, 94, 43,
    [["todos", "Todos"]].concat(D.meta.anos.map(a => [String(a), String(a)])),
    F.ano, v => F.ano = v);
  seletor(735, 46, 82, 42,
    [["T", "Todos"]].concat(MESES.map((m, i) => [String(i + 1), m])),
    F.mes, v => F.mes = v);
  seletor(855, 46, 131, 42,
    [["T", "Todos"]].concat(linhas.map(l => [l, l])),
    F.linha, v => F.linha = v);
  seletor(1038, 46, 175, 47,
    MEDIDAS.map((m, i) => [String(i), m.nome]),
    F.medida, v => F.medida = Number(v));

  // -------------------------------------------------------- cartoes
  const at = totais(false), ly = temLY() ? totais(true) : null;
  const notA = notas(false), notL = temLY() ? notas(true) : 0;

  cartao(153, 146, 204, 130, "Faturamento", moeda(at.fat),
         at.fat, ly ? ly.fat : 0, moeda);
  cartao(369, 146, 213, 130, "Margem Bruta", moeda(at.margem),
         at.margem, ly ? ly.margem : 0, moeda);
  cartao(586, 145, 203, 131, "Notas Emitidas", inteiro(notA),
         notA, notL, inteiro);

  // ------------------------------------- mini barras vs ano anterior
  const pares = [
    [166, 276, 190, 85, at.fat, ly ? ly.fat : 0],
    [380, 276, 188, 85, at.margem, ly ? ly.margem : 0],
    [596, 276, 189, 85, notA, notL],
  ];
  // "VS ANO ANTERIOR:" tambem vem do SVG
  pares.forEach(([x, y, w, h, a, b]) =>
    caixa(x, y, w, h, miniBarra(w, h, a, b)));

  // ------------------------------------------- titulos das secoes
  const med = MEDIDAS[F.medida];
  caixa(833, 136, 262, 32,
    div("titulo-din", null, med.nome.toUpperCase() + " POR PRODUTO"));
  caixa(172, 402, 263, 32,
    div("titulo-din", null, med.nome.toUpperCase() + " AO LONGO DO TEMPO"));

  // ------------------------------------------------ por grupo de produto
  const grp = [...agregar("grupo", false).entries()]
    .map(([g, a]) => ({ rotulo: D.dim.grupo[g].nome, valor: a[med.campo] }))
    .sort((a, b) => b.valor - a.valor).slice(0, 7);
  caixa(827, 171, 387, 188, barrasH(387, 188, grp));

  // ------------------------------------------------------------ combo
  const ps = periodos(false);
  const rot = ps.map(p => MESES[mesDe[p] - 1] || D.periodo_rotulo[p]);
  // um mapa so, sobre todos os periodos, serve as colunas e a linha
  const todos = agregar("periodo", false, D.periodos.map((_, i) => i));
  const col = ps.map(p => (todos.get(p) || {})[med.campo] || 0);
  const linhaLY = ps.map(p => {
    const q = periodoLY[p];
    return q < 0 ? 0 : ((todos.get(q) || {})[med.campo] || 0);
  });
  caixa(170, 444, 606, 216,
    combo(606, 216, rot, col, linhaLY.some(v => v > 0) ? linhaLY : null));

  // -------------------------------------------------- top vendedores
  const vend = [...agregar("vendedor", false).entries()]
    .map(([v, a]) => ({ v, valor: a[med.campo] }))
    .sort((a, b) => b.valor - a.valor).slice(0, 3);
  const lista = vend.map((it, i) => {
    const d = div("vend");
    const img = document.createElement("img");
    img.src = D.dim.vendedor[it.v].foto;
    img.alt = D.dim.vendedor[it.v].nome;
    img.loading = "lazy";
    d.appendChild(img);
    d.appendChild(div("nome", null, D.dim.vendedor[it.v].nome));
    d.appendChild(div("num", null, moeda(it.valor)));
    return d;
  });
  caixa(908, 470, 292, 180, lista);
}

/* ------------------------------------------------ escala da tela */
function escalar() {
  const larg = document.documentElement.clientWidth;
  const k = Math.min(1, (larg - 24) / 1280);
  TELA.style.transform = "scale(" + k + ")";
  document.getElementById("palco").style.height = (720 * k + 24) + "px";
}
window.addEventListener("resize", escalar);

desenhar();
escalar();
</script>
