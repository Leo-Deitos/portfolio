<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Painel interativo (HTML/JS, sem Power BI) de vendas - dados ficticios, servidos por SQL Server, para portfolio." />
<title>Dashboard de Vendas</title>
<style>
/* ==================================================================
   PALETA - ambar e grafite, nos dois temas.

   O tema claro vive em :root e o escuro em :root[data-theme="dark"],
   mesmo padrao do logistica1-dashboard.html. Os tokens tem os MESMOS
   nomes nos dois, entao nenhum componente precisa saber qual tema esta
   ativo - ele so pede a cor pelo nome.

   Os graficos sao SVG desenhado por JS, e SVG nao herda variavel CSS em
   atributo de forma confiavel. Por isso o JS le os tokens com
   getComputedStyle (funcao cor() la embaixo) e redesenha tudo quando o
   tema muda. E por isso que trocar de tema chama renderizar().

   O ambar do tema claro (#9A6400) e bem mais escuro que o do escuro
   (#F5A623): sobre fundo areia, o ambar vivo nao tem contraste para
   texto. Mesma logica no verde e no vermelho.
   ================================================================== */
:root{
  color-scheme:light;
  --fundo:#F7F4ED;
  --superficie:#FFFFFF;
  --superficie-2:#F0EADE;
  --borda:#DED5C4;
  --texto:#1C1813;
  --texto-2:#4A4236;
  --texto-3:#847A69;

  --acento:#9A6400;          /* ambar escurecido para contraste no claro */
  --acento-forte:#7A4F00;
  --acento-suave:#E8B54A;
  --grafite:#4A4236;

  --positivo:#1F7A3D;
  --negativo:#B3261E;
  --alerta:#9A6400;

  --sombra:0 1px 2px rgba(28,24,19,.06), 0 6px 20px -6px rgba(28,24,19,.14);
  --tt-fundo:rgba(255,255,255,.98);
  --tt-borda:#CFC4AF;

  /* sequencia categorica: treemap, barras por fornecedor, etc. */
  --c1:#9A6400; --c2:#4A4236; --c3:#B07A2B; --c4:#6B7A5A;
  --c5:#8C5A3C; --c6:#5E6B7A; --c7:#A8894C; --c8:#7A5C6B;
  --c9:#3F5750; --c10:#96703F; --c11:#5A5347; --c12:#7E8A6B;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --fundo:#14120E;
  --superficie:#1E1B16;
  --superficie-2:#2A251E;
  --borda:#3B342A;
  --texto:#F5F1E8;
  --texto-2:#D4CBB9;
  --texto-3:#968C79;

  --acento:#F5A623;
  --acento-forte:#FFC15E;
  --acento-suave:#7A5312;
  --grafite:#8A7F6C;

  --positivo:#5FBF7A;
  --negativo:#E8695F;
  --alerta:#F5C24A;

  --sombra:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -8px rgba(0,0,0,.65);
  --tt-fundo:rgba(30,27,22,.985);
  --tt-borda:#4C4437;

  --c1:#F5A623; --c2:#C9BCA3; --c3:#E0873A; --c4:#9DBE7E;
  --c5:#D98E6A; --c6:#8FA8C4; --c7:#E3C77A; --c8:#C49AB0;
  --c9:#7FB3A6; --c10:#D9A85F; --c11:#A69B85; --c12:#B6C79A;
}
:root{
  --raio:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fundo);
  color:var(--texto);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ------------------------------------------------------ cabecalho */
header{
  position:sticky;top:0;z-index:40;
  background:var(--superficie);
  border-bottom:1px solid var(--borda);
}
.topo{
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  padding:14px 22px 0;
}
.marca{display:flex;align-items:center;gap:12px;margin-right:auto}
.marca .selo{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--acento),var(--acento-forte));
  display:grid;place-items:center;font-weight:700;font-size:15px;
}
.marca h1{font-size:16px}
.marca p{margin:0;font-size:11.5px;color:var(--texto-3)}
.tema{
  padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;
  border:1px solid var(--borda);background:var(--superficie-2);
  color:var(--texto-2);white-space:nowrap;transition:.15s;
}
.tema:hover{border-color:var(--acento);color:var(--acento)}
.tema:focus-visible{outline:2px solid var(--acento);outline-offset:2px}

nav{display:flex;gap:2px;padding:10px 22px 0;overflow-x:auto}
nav button{
  padding:9px 16px;border-radius:8px 8px 0 0;
  font-size:12.5px;font-weight:600;letter-spacing:.4px;
  color:var(--texto-3);white-space:nowrap;
  border-bottom:2px solid transparent;
}
nav button:hover{color:var(--texto-2);background:rgba(255,255,255,.04)}
nav button[aria-selected="true"]{
  color:var(--texto);background:var(--superficie);
  border-bottom-color:var(--acento);
}

/* -------------------------------------------------------- filtros */
.filtros{
  display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;
  padding:12px 22px 14px;background:var(--superficie);
  border-top:1px solid var(--borda);
}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo>span{
  font-size:10px;font-weight:700;letter-spacing:.9px;
  text-transform:uppercase;color:var(--texto-3);
}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{
  padding:5px 11px;border-radius:999px;font-size:12px;
  border:1px solid var(--borda);background:var(--superficie-2);
  color:var(--texto-3);transition:.12s;
}
.chip:hover{border-color:#465468;color:var(--texto-2)}
.chip[aria-pressed="true"]{
  background:var(--acento-forte);border-color:var(--acento-forte);color:#fff;font-weight:600;
}
.chip.mes{padding:5px 9px;min-width:38px;text-align:center}
.medida .chip[aria-pressed="true"]{background:var(--acento);border-color:#8B2BD8}
.limpar{font-size:11.5px;color:var(--texto-3);text-decoration:underline;padding:5px 0}
.limpar:hover{color:var(--acento)}

/* --------------------------------------------------------- paginas */
main{padding:20px 22px 48px;max-width:1560px;margin:0 auto}
section[role="tabpanel"]{display:none;animation:entra .18s ease-out}
section[role="tabpanel"].ativa{display:block}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.grade{display:grid;gap:16px}
.g-kpis{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g-2{grid-template-columns:2fr 1fr}
.g-2b{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@media(max-width:1080px){.g-2,.g-2b{grid-template-columns:1fr}}

.cartao{
  background:var(--superficie);border:1px solid var(--borda);
  border-radius:var(--raio);padding:16px 18px;min-width:0;
}
.cartao>h2{
  font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--texto-3);margin-bottom:12px;
}
.cartao .nota{font-size:11px;color:var(--texto-3);margin-top:10px}

/* ------------------------------------------------------- kpi cards */
.kpi{position:relative;overflow:hidden}
.kpi::after{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;
  background:linear-gradient(180deg,var(--acento),var(--acento-forte));
}
.kpi .rotulo{
  font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--texto-3);
}
.kpi .valor{font-size:30px;font-weight:600;letter-spacing:-.5px;margin:6px 0 2px;
  font-variant-numeric:tabular-nums}
.kpi .rodape{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--texto-3)}
.var{font-weight:700;font-variant-numeric:tabular-nums}
.var.sobe{color:var(--positivo)}
.var.desce{color:var(--negativo)}
.var.nulo{color:var(--texto-3)}

/* ---------------------------------------------------------- listas */
.ranking{display:flex;flex-direction:column;gap:2px}
.linha-rank{
  display:grid;grid-template-columns:26px 34px 1fr auto;
  align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:default;
}
.linha-rank:hover{background:var(--superficie-2)}
.linha-rank .pos{font-size:11px;color:var(--texto-3);text-align:right;font-variant-numeric:tabular-nums}
.linha-rank img{width:34px;height:34px;border-radius:50%;object-fit:cover;
  background:var(--superficie-2);border:1px solid var(--borda)}
.linha-rank .nome{font-size:13px;font-weight:500}
.linha-rank .eq{font-size:10.5px;color:var(--texto-3)}
.linha-rank .num{font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.barra-fundo{height:4px;border-radius:2px;background:var(--superficie-2);margin-top:4px;overflow:hidden}
.barra-fundo i{display:block;height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--acento),var(--acento))}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap}
th{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--texto-3);
  border-bottom:1px solid var(--borda);font-weight:700}
td{border-bottom:1px solid rgba(47,56,67,.5);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tbody tr:hover{background:var(--superficie-2)}
.rolagem{overflow-x:auto}

/* --------------------------------------------------------- semaforo */
.pastilha{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.3px;
}
.pastilha i{width:7px;height:7px;border-radius:50%;display:block}
.st-ok{background:rgba(177,255,160,.13);color:var(--positivo)}
.st-ok i{background:var(--positivo)}
.st-atencao{background:rgba(244,210,90,.13);color:var(--alerta)}
.st-atencao i{background:var(--alerta)}
.st-abaixo{background:rgba(255,146,146,.13);color:var(--negativo)}
.st-abaixo i{background:var(--negativo)}

/* ------------------------------------------------------------ svg */
svg{display:block;width:100%;height:auto;overflow:visible}
.eixo{stroke:var(--borda);stroke-width:1}
.grade-linha{stroke:rgba(47,56,67,.65);stroke-width:1;stroke-dasharray:3 4}
.rotulo-eixo{fill:var(--texto-3);font-size:10.5px}
.alvo{cursor:pointer}
.alvo:hover{filter:brightness(1.22)}

/* ----------------------------------------------- tooltip com grafico */
#tooltip{
  position:fixed;z-index:90;pointer-events:none;opacity:0;
  transform:translateY(4px);transition:opacity .11s ease,transform .11s ease;
  background:var(--tt-fundo);border:1px solid var(--tt-borda);
  border-radius:var(--raio);box-shadow:var(--sombra);
  padding:12px 14px;width:290px;backdrop-filter:blur(6px);
}
#tooltip.visivel{opacity:1;transform:none}
#tooltip .tt-cab{display:flex;align-items:center;gap:10px;margin-bottom:2px}
#tooltip .tt-cab img{width:32px;height:32px;border-radius:6px;object-fit:cover;
  background:var(--superficie-2);flex:none}
#tooltip .tt-titulo{font-size:13px;font-weight:600;line-height:1.25}
#tooltip .tt-sub{font-size:10.5px;color:var(--texto-3);letter-spacing:.3px;text-transform:uppercase}
#tooltip .tt-valor{font-size:19px;font-weight:600;margin:6px 0 0;font-variant-numeric:tabular-nums}
#tooltip .tt-legenda{display:flex;justify-content:space-between;font-size:10.5px;
  color:var(--texto-3);margin-top:3px}
#tooltip .tt-rodape{
  display:flex;justify-content:space-between;gap:8px;margin-top:9px;padding-top:8px;
  border-top:1px solid var(--borda);font-size:11px;color:var(--texto-3);
}
#tooltip .tt-rodape b{color:var(--texto-2);font-weight:600;font-variant-numeric:tabular-nums}

.aviso{
  background:rgba(244,210,90,.08);border:1px solid rgba(244,210,90,.3);
  color:var(--alerta);border-radius:8px;padding:9px 13px;font-size:12px;margin-bottom:16px;
}
.vazio{color:var(--texto-3);font-size:12.5px;padding:20px 0;text-align:center}
footer{color:var(--texto-3);font-size:11px;padding:22px 22px 34px;max-width:1560px;margin:0 auto;
  border-top:1px solid var(--borda)}
</style>
</head>
<body>

<header>
  <div class="topo">
    <div class="marca">
      <div class="selo">V</div>
      <div>
        <h1>Dashboard de Vendas</h1>
        <p id="sub-periodo">carregando…</p>
      </div>
    </div>
    <button id="btn-tema" class="tema" type="button">☽  escuro</button>
  </div>

  <nav role="tablist" id="nav">
    <button role="tab" data-pagina="home"    aria-selected="true">HOME</button>
    <button role="tab" data-pagina="perf"    aria-selected="false">PERFORMANCE</button>
    <button role="tab" data-pagina="decomp"  aria-selected="false">DECOMPOSIÇÃO</button>
    <button role="tab" data-pagina="kr"      aria-selected="false">KEY RESULTS</button>
  </nav>

  <div class="filtros">
    <label class="campo"><span>Ano</span><div class="chips" id="f-ano"></div></label>
    <label class="campo"><span>Mês</span><div class="chips" id="f-mes"></div></label>
    <label class="campo"><span>Linha de produto</span><div class="chips" id="f-linha"></div></label>
    <label class="campo medida"><span>Medida em análise</span><div class="chips" id="f-medida"></div></label>
    <button class="limpar" id="btn-limpar">limpar filtros</button>
  </div>
</header>

<main>
  <section role="tabpanel" id="pg-home" class="ativa"></section>
  <section role="tabpanel" id="pg-perf"></section>
  <section role="tabpanel" id="pg-decomp"></section>
  <section role="tabpanel" id="pg-kr"></section>
</main>

<footer id="rodape"></footer>

<script>
"use strict";

/* ====================================================================
   0. CARGA
   O painel le window.DADOS_VENDAS (dados.js). Se o arquivo for aberto
   por um servidor, dados.json tambem serve - o fallback abaixo cobre os
   dois casos. dados.js existe porque, em file://, o navegador bloqueia
   fetch de arquivo local por CORS, mas carrega <script src>.
   ==================================================================== */

const $ = (s, raiz) => (raiz || document).querySelector(s);
const criar = (tag, attrs, filhos) => {
  const e = document.createElementNS(
    tag === "svg" || SVG_TAGS.has(tag) ? "http://www.w3.org/2000/svg"
                                       : "http://www.w3.org/1999/xhtml", tag);
  for (const k in (attrs || {})) {
    if (k === "class") e.setAttribute("class", attrs[k]);
    else if (k === "text") e.textContent = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  }
  (filhos || []).forEach(f => f && e.appendChild(f));
  return e;
};
const SVG_TAGS = new Set(["svg","g","rect","circle","line","path","text","polyline",
  "polygon","defs","linearGradient","stop","clipPath","tspan","image","title"]);

let D = null;

/* ====================================================================
   TEMA CLARO / ESCURO

   Os graficos sao SVG gerado por JS, e um <rect fill="var(--acento)">
   nao resolve a variavel de forma confiavel em todo navegador. Entao o
   JS le o valor computado do token e usa a cor literal - e redesenha
   tudo quando o tema muda.

   cor() guarda o resultado em cache porque e chamada centenas de vezes
   por render; o cache e limpo a cada troca de tema.
   ==================================================================== */

const TEMA = {
  chave: "vendas1-tema",
  cache: {},

  atual() {
    return document.documentElement.getAttribute("data-theme") === "dark"
      ? "dark" : "light";
  },

  aplicar(nome, redesenhar) {
    document.documentElement.setAttribute("data-theme", nome);
    TEMA.cache = {};
    try { localStorage.setItem(TEMA.chave, nome); } catch (e) {}
    const b = document.getElementById("btn-tema");
    if (b) {
      const escuro = nome === "dark";
      b.textContent = escuro ? "☼  claro" : "☽  escuro";
      b.setAttribute("aria-label",
        escuro ? "Mudar para tema claro" : "Mudar para tema escuro");
    }
    if (redesenhar) renderizar();
  },

  alternar() {
    TEMA.aplicar(TEMA.atual() === "dark" ? "light" : "dark", true);
  },

  /* Ordem de decisao: o que a pessoa escolheu antes; senao o que o
     sistema operacional pede; senao escuro, que e como o painel nasceu. */
  iniciar() {
    let salvo = null;
    try { salvo = localStorage.getItem(TEMA.chave); } catch (e) {}
    if (!salvo) {
      salvo = window.matchMedia
        && window.matchMedia("(prefers-color-scheme: light)").matches
        ? "light" : "dark";
    }
    TEMA.aplicar(salvo, false);
  },
};

/* Le um token CSS do tema em vigor. */
function cor(token) {
  if (TEMA.cache[token]) return TEMA.cache[token];
  const v = getComputedStyle(document.documentElement)
    .getPropertyValue(token).trim();
  TEMA.cache[token] = v || "#888888";
  return TEMA.cache[token];
}

function iniciar() {
  D = window.DADOS_VENDAS;
  if (!D) {
    fetch("dados.json").then(r => r.json()).then(j => { D = j; arrancar(); })
      .catch(() => {
        document.querySelector("main").innerHTML =
          '<div class="aviso">Não encontrei os dados. Rode ' +
          '<code>python gerar_dados_json.py</code> na pasta do painel para gerar ' +
          '<code>dados.js</code> ao lado deste arquivo.</div>';
      });
    return;
  }
  arrancar();
}

/* ====================================================================
   1. MODELO EM MEMORIA
   ==================================================================== */

const M = {};          // indices derivados de D, montados uma vez

function prepararModelo() {
  M.periodos   = D.periodos;
  M.rotulos    = D.periodo_rotulo;
  M.nPeriodos  = D.periodos.length;
  M.anos       = D.meta.anos;
  M.grupos     = D.dim.grupo;
  M.vendedores = D.dim.vendedor;

  // periodo -> ano / mes, para os filtros
  M.anoDe = D.periodos.map(am => Math.floor(am / 100));
  M.mesDe = D.periodos.map(am => am % 100);

  // periodo -> indice do mesmo mes no ano anterior (-1 se nao existe)
  M.periodoLY = D.periodos.map(am => {
    const alvo = (Math.floor(am / 100) - 1) * 100 + (am % 100);
    return D.periodos.indexOf(alvo);
  });

  // dimensoes derivadas do grupo (relacao 1:1, garantida pelo SQL)
  M.linhas      = [...new Set(M.grupos.map(g => g.linha))].sort();
  M.fornecedores= [...new Set(M.grupos.map(g => g.fornecedor))].sort();
  M.equipes     = [...new Set(M.vendedores.map(v => v.equipe))].sort();
  M.linhaDoGrupo      = M.grupos.map(g => g.linha);
  M.fornecedorDoGrupo = M.grupos.map(g => g.fornecedor);
  M.equipeDoVendedor  = M.vendedores.map(v => v.equipe);

  M.ixFornecedor = Object.fromEntries(M.fornecedores.map((f, i) => [f, i]));
  M.ixEquipe     = Object.fromEntries(M.equipes.map((e, i) => [e, i]));
  M.ixLinha      = Object.fromEntries(M.linhas.map((l, i) => [l, i]));
}

/* ------------------------------------------------------------------
   Estado dos filtros. mesesSel vazio = todos os meses.
   ------------------------------------------------------------------ */
const F = { pagina: "home", ano: "todos", meses: new Set(), linha: "T", medida: 0 };

const MEDIDAS = [
  { id: 0, nome: "Faturamento",  campo: "fat" },
  { id: 1, nome: "Margem Bruta", campo: "margem" },
];
const medidaAtual = () => MEDIDAS[F.medida];

/* ------------------------------------------------------------------
   Selecao de periodos e de grupos a partir dos filtros.
   ------------------------------------------------------------------ */
function periodosSelecionados(deslocarAno) {
  const alvoAno = deslocarAno && F.ano !== "todos" ? Number(F.ano) - 1 : F.ano;
  const ativos = [];
  for (let p = 0; p < M.nPeriodos; p++) {
    if (alvoAno !== "todos" && M.anoDe[p] !== Number(alvoAno)) continue;
    if (F.meses.size && !F.meses.has(M.mesDe[p])) continue;
    ativos.push(p);
  }
  return ativos;
}
function gruposSelecionados() {
  const ativos = [];
  for (let g = 0; g < M.grupos.length; g++)
    if (F.linha === "T" || M.linhaDoGrupo[g] === F.linha) ativos.push(g);
  return ativos;
}

/* ------------------------------------------------------------------
   Consulta ao fato. Cada linha e [grupo, vendedor, periodo, fat, custo].
   O fato tem ~3.700 linhas: percorrer inteiro a cada render e barato e
   evita qualquer indice pre-montado que fique desatualizado.

   dimensao: null | "vendedor" | "grupo" | "fornecedor" | "equipe"
             | "linha" | "periodo"
   Devolve Map chave -> {fat, custo, margem}
   ------------------------------------------------------------------ */
function consultar(dimensao, opcoes) {
  const o = opcoes || {};
  const pSel = new Set(o.periodos || periodosSelecionados(o.ly));
  const gSel = new Set(o.grupos || gruposSelecionados());
  const filtroVendedor = o.vendedor === undefined ? null : o.vendedor;
  const fora = new Map();

  for (const [g, v, p, fat, custo] of D.fato) {
    if (!pSel.has(p) || !gSel.has(g)) continue;
    if (filtroVendedor !== null && v !== filtroVendedor) continue;

    let chave;
    switch (dimensao) {
      case "vendedor":   chave = v; break;
      case "grupo":      chave = g; break;
      case "fornecedor": chave = M.ixFornecedor[M.fornecedorDoGrupo[g]]; break;
      case "equipe":     chave = M.ixEquipe[M.equipeDoVendedor[v]]; break;
      case "linha":      chave = M.ixLinha[M.linhaDoGrupo[g]]; break;
      case "periodo":    chave = p; break;
      default:           chave = 0;
    }
    let a = fora.get(chave);
    if (!a) { a = { fat: 0, custo: 0, margem: 0 }; fora.set(chave, a); }
    a.fat += fat; a.custo += custo;
  }
  for (const a of fora.values()) a.margem = a.fat - a.custo;
  return fora;
}

const totalDe = (mapa, campo) => {
  let s = 0; for (const a of mapa.values()) s += a[campo]; return s;
};

/* ------------------------------------------------------------------
   Notas emitidas. NFe nao e aditiva, entao vem pre-contada do gerador.
   Chave de periodo: "TT" (tudo), "aAAAA" (ano fechado) ou o indice do
   mes. Selecao avulsa de meses soma os meses e superestima 0,04%.
   ------------------------------------------------------------------ */
function chavesPeriodoNotas(deslocarAno) {
  const ano = deslocarAno && F.ano !== "todos" ? Number(F.ano) - 1 : F.ano;
  if (!F.meses.size) return ano === "todos" ? ["TT"] : ["a" + ano];
  return periodosSelecionados(deslocarAno).map(String);
}
function notas(tipo, id, deslocarAno) {
  const bloco = D.notas[tipo][F.linha];
  if (!bloco) return 0;
  let s = 0;
  for (const cp of chavesPeriodoNotas(deslocarAno)) {
    const k = tipo === "total" ? cp : cp + "|" + id;
    s += bloco[k] || 0;
  }
  return s;
}
const notasExatas = () => !F.meses.size;   // sem selecao de meses -> exato

/* ------------------------------------------------------------------
   Series temporais: valor da medida por periodo, para um item.
   Sao a materia-prima do tooltip com grafico.
   ------------------------------------------------------------------ */
function serie(dimensao, id, campo) {
  const cp = campo || medidaAtual().campo;
  const gSel = new Set(gruposSelecionados());
  const fora = new Array(M.nPeriodos).fill(0);

  for (const [g, v, p, fat, custo] of D.fato) {
    if (!gSel.has(g)) continue;
    let bate;
    switch (dimensao) {
      case "vendedor":   bate = v === id; break;
      case "grupo":      bate = g === id; break;
      case "fornecedor": bate = M.fornecedorDoGrupo[g] === M.fornecedores[id]; break;
      case "equipe":     bate = M.equipeDoVendedor[v] === M.equipes[id]; break;
      default:           bate = true;
    }
    if (!bate) continue;
    fora[p] += cp === "custo" ? custo : cp === "margem" ? fat - custo : fat;
  }
  return fora;
}

/* ====================================================================
   2. FORMATACAO
   ==================================================================== */

const fmtMoeda = new Intl.NumberFormat("pt-BR",
  { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const fmtInt = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
const fmtPct1 = new Intl.NumberFormat("pt-BR",
  { style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 });

function compacto(v) {
  const a = Math.abs(v);
  if (a >= 1e9) return "R$ " + (v / 1e9).toFixed(1).replace(".", ",") + " bi";
  if (a >= 1e6) return "R$ " + (v / 1e6).toFixed(1).replace(".", ",") + " mi";
  if (a >= 1e3) return "R$ " + (v / 1e3).toFixed(0) + " mil";
  return fmtMoeda.format(v);
}

/* Equivalente ao FORMAT([% ... YoY], " ⇡ 0%;  ⇣ 0%") do modelo DAX. */
function detalheYoY(pct) {
  if (pct === null || !isFinite(pct)) return { texto: "—", classe: "nulo" };
  const seta = pct >= 0 ? "⇡" : "⇣";
  return {
    texto: seta + " " + Math.round(Math.abs(pct) * 100) + "%",
    classe: pct >= 0 ? "sobe" : "desce",
  };
}
const variacao = (atual, anterior) =>
  (anterior === null || !anterior) ? null : (atual - anterior) / anterior;

/* ====================================================================
   3. TOOLTIP COM GRAFICO  (requisito da pagina Home, reutilizado
      em todas as outras)

      ligarTooltip(elemento, provedor)

      provedor() devolve:
        { titulo, subtitulo, foto, serie:[numeros por periodo],
          unidade:"moeda"|"inteiro", rodape:[{rotulo, valor}] }

      O mini-grafico e uma area com linha, marcador no maior valor e os
      rotulos das pontas - a serie inteira do item, nao so o numero sob
      o cursor.
   ==================================================================== */

const TT = {
  el: null,
  ligar(alvo, provedor) {
    alvo.addEventListener("mouseenter", ev => TT.mostrar(provedor(), ev));
    alvo.addEventListener("mousemove", TT.posicionar);
    alvo.addEventListener("mouseleave", TT.esconder);
  },
  mostrar(dados, ev) {
    if (!dados) return;
    const el = TT.el;
    el.textContent = "";
    el.appendChild(cabecalhoTooltip(dados));
    el.appendChild(graficoTooltip(dados));
    if (dados.rodape && dados.rodape.length) el.appendChild(rodapeTooltip(dados));
    el.classList.add("visivel");
    el.setAttribute("aria-hidden", "false");
    TT.posicionar(ev);
  },
  posicionar(ev) {
    const el = TT.el, m = 16;
    const l = el.offsetWidth, a = el.offsetHeight;
    let x = ev.clientX + m, y = ev.clientY + m;
    if (x + l > innerWidth - 8) x = ev.clientX - l - m;
    if (y + a > innerHeight - 8) y = Math.max(8, ev.clientY - a - m);
    el.style.left = x + "px";
    el.style.top = y + "px";
  },
  esconder() {
    TT.el.classList.remove("visivel");
    TT.el.setAttribute("aria-hidden", "true");
  },
};

function cabecalhoTooltip(d) {
  const txt = criar("div", {}, [
    criar("div", { class: "tt-titulo", text: d.titulo }),
    d.subtitulo ? criar("div", { class: "tt-sub", text: d.subtitulo }) : null,
  ]);
  const cab = criar("div", { class: "tt-cab" },
    [d.foto ? criar("img", { src: d.foto, alt: "" }) : null, txt]);
  // O numero grande e o total do PERIODO FILTRADO, para bater com o que
  // o visual mostra. O grafico abaixo continua exibindo a serie inteira,
  // com o trecho filtrado em destaque.
  const total = d.total !== undefined ? d.total : somaNaSelecao(d.serie);
  const box = criar("div", {}, [cab,
    criar("div", { class: "tt-valor",
      text: d.unidade === "inteiro" ? fmtInt.format(total) : fmtMoeda.format(total) })]);
  return box;
}

const somaNaSelecao = s => periodosSelecionados(false)
  .reduce((a, p) => a + (s[p] || 0), 0);

function rodapeTooltip(d) {
  return criar("div", { class: "tt-rodape" },
    d.rodape.map(r => criar("span", {}, [
      document.createTextNode(r.rotulo + " "),
      criar("b", { text: r.valor }),
    ])));
}

/* Mini-grafico de area do tooltip. Desenhado do zero em SVG: sem
   biblioteca, e o mesmo componente serve para qualquer serie. */
function graficoTooltip(d) {
  const L = 262, A = 74, base = A - 15, topo = 6;
  const s = d.serie, n = s.length;
  const max = Math.max(...s, 1);
  const px = i => n === 1 ? L / 2 : (i / (n - 1)) * L;
  const py = v => base - (v / max) * (base - topo);

  const pontos = s.map((v, i) => px(i) + "," + py(v)).join(" ");
  const area = "M0," + base + " L" + s.map((v, i) => px(i) + "," + py(v)).join(" L")
             + " L" + L + "," + base + " Z";
  const iMax = s.indexOf(Math.max(...s));
  const idTT = novoId("gTT");

  // Faixa de destaque sobre os meses que o filtro deixou passar - deixa
  // claro qual trecho da serie corresponde ao numero acima. Nao se aplica
  // quando a serie ja veio recortada e traz rotulos proprios.
  const sel = d.rotulos ? [] : (d.selecao || periodosSelecionados(false));
  let realce = null;
  if (sel.length && sel.length < n) {
    const x0 = px(Math.min(...sel)), x1 = px(Math.max(...sel));
    realce = criar("rect", {
      x: Math.max(x0 - 3, 0), y: 0, width: Math.max(x1 - x0 + 6, 6), height: base,
      fill: cor("--acento"), "fill-opacity": ".12", rx: 2,
    });
  }

  const svg = criar("svg", { viewBox: "0 0 " + L + " " + A, width: L, height: A }, [
    criar("defs", {}, [
      criar("linearGradient", { id: idTT, x1: "0", y1: "0", x2: "0", y2: "1" }, [
        criar("stop", { offset: "0%",   "stop-color": cor("--acento"), "stop-opacity": ".5" }),
        criar("stop", { offset: "100%", "stop-color": cor("--acento"), "stop-opacity": "0" }),
      ]),
    ]),
    realce,
    criar("path", { d: area, fill: "url(#" + idTT + ")" }),
    criar("polyline", { points: pontos, fill: "none", stroke: cor("--acento"),
                        "stroke-width": "1.8", "stroke-linejoin": "round" }),
    criar("circle", { cx: px(iMax), cy: py(s[iMax]), r: "3", fill: cor("--acento"),
                      stroke: cor("--superficie"), "stroke-width": "1.5" }),
    criar("line", { x1: 0, y1: base, x2: L, y2: base, class: "eixo" }),
  ]);

  const rot = d.rotulos || M.rotulos;
  const legenda = criar("div", { class: "tt-legenda" }, [
    criar("span", { text: rot[0] }),
    criar("span", { text: "pico " + rot[iMax] + " · " + compacto(s[iMax]) }),
    criar("span", { text: rot[n - 1] }),
  ]);
  return criar("div", {}, [svg, legenda]);
}

/* ====================================================================
   4. GRAFICOS DA PAGINA (SVG puro)
   ==================================================================== */

/* Sequencia categorica: 12 tons definidos por tema em --c1..--c12. */
const paleta = () => Array.from({ length: 12 }, (_, i) => cor("--c" + (i + 1)));

/* Preto ou branco sobre um fundo qualquer, escolhido pela luminancia do
   proprio fundo. No treemap os blocos vao de ocre claro a grafite
   escuro: uma cor de texto fixa fica ilegivel em metade deles.
   Coeficientes da luminancia relativa (Rec. 709). */
function contraste(hex) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex.trim());
  if (!m) return "#000000";
  const [r, g, b] = [1, 2, 3].map(i => parseInt(m[i], 16) / 255);
  const lin = c => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  return L > 0.42 ? "#14120E" : "#FFFFFF";
}

/* Todo gradiente ganha id proprio. Ids de SVG sao globais ao documento:
   com o id repetido, um grafico de uma pagina oculta (display:none)
   vencia a busca e o gradiente virava invisivel - as barras sumiam. */
let seqGrad = 0;
const novoId = prefixo => prefixo + "-" + (++seqGrad);

/* 4.1 Colunas (medida) + linha (mesmo periodo do ano anterior).
       E o visual "ao longo do tempo" do material original.        */
function graficoCombo(dados) {
  const { rotulos, colunas, linha, aoPassar } = dados;
  const L = 900, A = 300, mE = 62, mD = 12, mT = 16, mB = 34;
  const iL = L - mE - mD, iA = A - mT - mB;
  const max = Math.max(...colunas, ...(linha || [0]), 1);
  const esc = v => iA - (v / max) * iA;
  const passo = iL / Math.max(colunas.length, 1);
  const larg = Math.min(passo * 0.62, 46);

  const idGrad = novoId("gCol");
  const g = [];
  for (let i = 0; i <= 4; i++) {
    const y = mT + (iA / 4) * i;
    const v = max * (1 - i / 4);
    g.push(criar("line", { x1: mE, y1: y, x2: mE + iL, y2: y, class: "grade-linha" }));
    g.push(criar("text", { x: mE - 8, y: y + 3.5, class: "rotulo-eixo",
                           "text-anchor": "end", text: compacto(v) }));
  }

  colunas.forEach((v, i) => {
    const x = mE + passo * i + (passo - larg) / 2;
    const y = mT + esc(v);
    const barra = criar("rect", {
      x, y, width: larg, height: Math.max(iA - esc(v), 1),
      rx: 3, fill: "url(#" + idGrad + ")", class: "alvo",
    });
    if (aoPassar) TT.ligar(barra, () => aoPassar(i));
    g.push(barra);
    if (colunas.length <= 14 || i % 2 === 0)
      g.push(criar("text", { x: mE + passo * i + passo / 2, y: A - mB + 15,
        class: "rotulo-eixo", "text-anchor": "middle", text: rotulos[i] }));
  });

  if (linha) {
    const pts = linha.map((v, i) => (mE + passo * i + passo / 2) + "," + (mT + esc(v))).join(" ");
    g.push(criar("polyline", { points: pts, fill: "none", stroke: cor("--grafite"),
      "stroke-width": "2", "stroke-dasharray": "5 4", "stroke-linejoin": "round" }));
    linha.forEach((v, i) => g.push(criar("circle", {
      cx: mE + passo * i + passo / 2, cy: mT + esc(v), r: 2.6, fill: cor("--grafite") })));
  }

  return criar("svg", { viewBox: "0 0 " + L + " " + A, role: "img" }, [
    criar("defs", {}, [
      criar("linearGradient", { id: idGrad, x1: "0", y1: "0", x2: "0", y2: "1" }, [
        criar("stop", { offset: "0%",   "stop-color": cor("--acento-forte") }),
        criar("stop", { offset: "100%", "stop-color": cor("--acento") }),
      ]),
    ]),
    ...g,
  ]);
}

/* 4.2 Barras horizontais com rotulo e valor. */
function graficoBarras(itens, aoPassar) {
  const L = 640, alturaLinha = 26, A = Math.max(itens.length * alturaLinha + 12, 40);
  const idGrad = novoId("gBar");
  const mE = 168, mD = 74;
  const iL = L - mE - mD;
  const max = Math.max(...itens.map(i => Math.abs(i.valor)), 1);
  const g = [];

  itens.forEach((it, i) => {
    const y = i * alturaLinha + 6;
    const w = Math.max((Math.abs(it.valor) / max) * iL, 2);
    g.push(criar("text", { x: mE - 10, y: y + 13, class: "rotulo-eixo",
      "text-anchor": "end", fill: cor("--texto-2"), text: it.rotulo }));
    const r = criar("rect", { x: mE, y: y + 3, width: w, height: 15, rx: 3,
      fill: it.cor || ("url(#" + idGrad + ")"), class: "alvo" });
    if (aoPassar) TT.ligar(r, () => aoPassar(it, i));
    g.push(r);
    g.push(criar("text", { x: mE + w + 8, y: y + 15, class: "rotulo-eixo",
      fill: cor("--texto-2"), text: compacto(it.valor) }));
  });

  return criar("svg", { viewBox: "0 0 " + L + " " + A, role: "img" }, [
    criar("defs", {}, [
      criar("linearGradient", { id: idGrad, x1: "0", y1: "0", x2: "1", y2: "0" }, [
        criar("stop", { offset: "0%",   "stop-color": cor("--acento") }),
        criar("stop", { offset: "100%", "stop-color": cor("--acento-forte") }),
      ]),
    ]),
    ...g,
  ]);
}

/* 4.3 Waterfall: mostra o que empurra o resultado para cima e para
       baixo, item a item, do inicio ao fim.                        */
function graficoWaterfall(itens, inicio, rotuloInicio, rotuloFim) {
  const L = 900, A = 360, mE = 66, mD = 12, mT = 22, mB = 84;
  const iL = L - mE - mD, iA = A - mT - mB;

  const passos = [{ rotulo: rotuloInicio, valor: inicio, tipo: "total" }]
    .concat(itens.map(i => ({ rotulo: i.rotulo, valor: i.valor, tipo: "delta", ref: i })))
    .concat([{ rotulo: rotuloFim, valor: inicio + itens.reduce((a, b) => a + b.valor, 0),
               tipo: "total" }]);

  let acum = 0;
  const niveis = passos.map(p => {
    if (p.tipo === "total") { const r = { de: 0, ate: p.valor }; acum = p.valor; return r; }
    const de = acum; acum += p.valor; return { de, ate: acum };
  });

  /* Escala: num waterfall de VARIACAO os totais sao ~20 mi e os deltas
     ~500 mil. Ancorar o eixo no zero achataria toda a variacao numa
     faixa de 2 pixels. Entao a escala cobre so a regiao onde as barras
     vivem, com uma folga, e as colunas de total nascem do piso do
     grafico. Na composicao (inicio = 0) o zero volta a fazer parte. */
  // Os totais entram so pelo valor final: o "de: 0" deles arrastaria a
  // escala de volta para o zero e achataria os deltas outra vez.
  const bruto = niveis.flatMap((n, i) =>
    passos[i].tipo === "total" ? [n.ate] : [n.de, n.ate]);
  if (inicio === 0) bruto.push(0);
  let max = Math.max(...bruto), min = Math.min(...bruto);
  const folga = (max - min || Math.abs(max) || 1) * 0.12;
  max += folga;
  min = inicio === 0 ? Math.min(min, 0) : min - folga;

  const esc = v => mT + iA - ((v - min) / (max - min || 1)) * iA;
  const piso = mT + iA;
  const passo = iL / passos.length;
  const larg = Math.min(passo * 0.66, 54);

  const modulos = itens.map(i => Math.abs(i.valor)).sort((a, b) => b - a);
  const limiarRotulo = modulos.length > 8 ? modulos[5] : 0;

  const g = [criar("line", { x1: mE, y1: piso, x2: mE + iL, y2: piso, class: "eixo" }),
             criar("text", { x: mE - 8, y: piso + 4, class: "rotulo-eixo",
                             "text-anchor": "end", text: compacto(min) })];

  passos.forEach((p, i) => {
    const n = niveis[i];
    // Total: barra cheia, do piso ate o valor. Delta: so o trecho entre
    // o acumulado anterior e o novo.
    const y1 = esc(Math.max(n.de, n.ate));
    const y2 = p.tipo === "total" ? piso : esc(Math.min(n.de, n.ate));
    const x = mE + passo * i + (passo - larg) / 2;
    const corBarra = p.tipo === "total" ? cor("--acento")
                  : (p.valor >= 0 ? cor("--positivo") : cor("--negativo"));
    const r = criar("rect", { x, y: y1, width: larg, height: Math.max(y2 - y1, 2),
      rx: 3, fill: corBarra, class: "alvo" });
    if (p.ref && p.ref.aoPassar) TT.ligar(r, p.ref.aoPassar);
    g.push(r);
    // Com 12 vendedores + 2 totais os rotulos de valor se atropelam.
    // So os maiores em modulo ganham rotulo; o resto sai no tooltip.
    if (p.tipo === "total" || Math.abs(p.valor) >= limiarRotulo)
      g.push(criar("text", { x: x + larg / 2, y: y1 - 6, class: "rotulo-eixo",
        "text-anchor": "middle", fill: p.tipo === "total" ? cor("--texto-2") : corBarra,
        text: (p.tipo === "delta" && p.valor >= 0 ? "+" : "") + compacto(p.valor) }));
    // rotulo inclinado, para caber nome de vendedor sem cortar
    const xr = mE + passo * i + passo / 2, yr = piso + 14;
    g.push(criar("text", { x: xr, y: yr, class: "rotulo-eixo", "text-anchor": "end",
      fill: p.tipo === "total" ? cor("--texto-2") : cor("--texto-3"),
      transform: "rotate(-38 " + xr + " " + yr + ")",
      text: p.rotulo.length > 18 ? p.rotulo.slice(0, 17) + "…" : p.rotulo }));
  });

  return criar("svg", { viewBox: "0 0 " + L + " " + A, role: "img" }, g);
}

/* 4.4 Treemap (squarified simplificado). */
function graficoTreemap(itens, aoPassar) {
  const L = 620, A = 340;
  const total = itens.reduce((a, b) => a + b.valor, 0) || 1;
  const g = [];

  // Faixas horizontais de altura proporcional; dentro de cada faixa, os
  // itens dividem a largura. Simples e estavel para ~25 itens.
  const porFaixa = Math.ceil(Math.sqrt(itens.length));
  let i = 0, y = 0;
  while (i < itens.length) {
    const faixa = itens.slice(i, i + porFaixa);
    const somaFaixa = faixa.reduce((a, b) => a + b.valor, 0) || 1;
    const alturaFaixa = (somaFaixa / total) * A;
    let x = 0;
    faixa.forEach((it, k) => {
      const larg = (it.valor / somaFaixa) * L;
      const cores = paleta();
      const corBloco = cores[(i + k) % cores.length];
      const bloco = criar("rect", { x: x + 1, y: y + 1,
        width: Math.max(larg - 2, 0), height: Math.max(alturaFaixa - 2, 0),
        rx: 3, fill: corBloco, class: "alvo" });
      if (aoPassar) TT.ligar(bloco, () => aoPassar(it));
      g.push(bloco);
      if (larg > 74 && alturaFaixa > 30) {
        const tinta = contraste(corBloco);
        g.push(criar("text", { x: x + 8, y: y + 18, class: "rotulo-eixo",
          fill: tinta, "font-weight": "600", text: it.rotulo }));
        g.push(criar("text", { x: x + 8, y: y + 32, class: "rotulo-eixo",
          fill: tinta, "fill-opacity": ".8", text: compacto(it.valor) }));
      }
      x += larg;
    });
    y += alturaFaixa;
    i += porFaixa;
  }
  return criar("svg", { viewBox: "0 0 " + L + " " + A, role: "img" }, g);
}

/* 4.5 Bullet: realizado contra meta, para a pagina Key Results. */
/* O parametro nao pode se chamar "cor": sombrearia a funcao global
   cor(), usada aqui dentro para ler os tokens do tema. */
function graficoBullet(realizado, meta, corBarra) {
  const L = 240, A = 22;
  const max = Math.max(realizado, meta, 1) * 1.06;
  const px = v => (v / max) * L;
  return criar("svg", { viewBox: "0 0 " + L + " " + A, width: L, height: A }, [
    criar("rect", { x: 0, y: 6, width: L, height: 10, rx: 5, fill: cor("--superficie-2") }),
    criar("rect", { x: 0, y: 6, width: Math.max(px(realizado), 2), height: 10, rx: 5, fill: corBarra }),
    criar("line", { x1: px(meta), y1: 2, x2: px(meta), y2: 20,
      stroke: cor("--texto-2"), "stroke-width": "2" }),
  ]);
}
</script>
<script>
"use strict";

/* ====================================================================
   5. PECAS REUTILIZADAS PELAS PAGINAS
   ==================================================================== */

function cartao(titulo, conteudo, classe) {
  return criar("div", { class: "cartao " + (classe || "") },
    [titulo ? criar("h2", { text: titulo }) : null].concat(conteudo));
}

function cartaoKPI(rotulo, valor, pctYoY, textoBase) {
  const d = detalheYoY(pctYoY);
  return criar("div", { class: "cartao kpi" }, [
    criar("div", { class: "rotulo", text: rotulo }),
    criar("div", { class: "valor", text: valor }),
    criar("div", { class: "rodape" }, [
      criar("span", { class: "var " + d.classe, text: d.texto }),
      criar("span", { text: textoBase }),
    ]),
  ]);
}

/* Provedores de tooltip - um por tipo de item. Todos devolvem a serie
   temporal completa do item, que e o que o mini-grafico desenha. */
function ttVendedor(v) {
  const s = serie("vendedor", v);
  const nome = M.vendedores[v].nome;
  return {
    titulo: nome,
    subtitulo: M.vendedores[v].equipe + " · " + medidaAtual().nome,
    foto: M.vendedores[v].foto,
    serie: s,
    rodape: [
      { rotulo: "notas", valor: fmtInt.format(notas("vendedor", v, false)) },
      { rotulo: "melhor mês", valor: M.rotulos[s.indexOf(Math.max(...s))] },
    ],
  };
}
function ttGrupo(g) {
  const s = serie("grupo", g);
  const info = M.grupos[g];
  return {
    titulo: info.nome,
    subtitulo: info.linha + " · " + info.fornecedor,
    foto: info.foto,
    serie: s,
    rodape: [
      { rotulo: "notas", valor: fmtInt.format(notas("grupo", g, false)) },
      { rotulo: "medida", valor: medidaAtual().nome },
    ],
  };
}
function ttPeriodo(p) {
  const dim = consultar("vendedor", { periodos: [p] });
  const campo = medidaAtual().campo;
  const ordenado = [...dim.entries()].sort((a, b) => b[1][campo] - a[1][campo]);
  const s = serie(null, null);
  return {
    titulo: M.rotulos[p],
    subtitulo: medidaAtual().nome + " no mês",
    serie: s,
    total: s[p],
    selecao: [p],
    rodape: ordenado.length ? [
      { rotulo: "líder", valor: M.vendedores[ordenado[0][0]].nome.split(" ")[0] },
      { rotulo: "no ano", valor: compacto(somaNaSelecao(s)) },
    ] : [],
  };
}
/* opcoes: { rotulos, total, selecao } - "rotulos" e usado quando a serie
   nao esta no eixo de periodos do modelo (ex.: acumulado do ano, que so
   tem os meses filtrados). Nesse caso o realce de selecao e dispensado,
   porque a serie inteira ja e o recorte. */
function ttSimples(titulo, subtitulo, s, extras, opcoes) {
  return Object.assign({ titulo, subtitulo, serie: s, rodape: extras || [] },
                       opcoes || {});
}

function listaRanking(itens, aoPassar) {
  const max = Math.max(...itens.map(i => Math.abs(i.valor)), 1);
  return criar("div", { class: "ranking" }, itens.map((it, i) => {
    const linha = criar("div", { class: "linha-rank" }, [
      criar("div", { class: "pos", text: String(i + 1) }),
      it.foto ? criar("img", { src: it.foto, alt: "", loading: "lazy" })
              : criar("div", {}),
      criar("div", {}, [
        criar("div", { class: "nome", text: it.rotulo }),
        it.sub ? criar("div", { class: "eq", text: it.sub }) : null,
        criar("div", { class: "barra-fundo" },
          [criar("i", { style: "width:" + (Math.abs(it.valor) / max * 100) + "%" })]),
      ]),
      criar("div", { class: "num", text: compacto(it.valor) }),
    ]);
    if (aoPassar) TT.ligar(linha, () => aoPassar(it, i));
    return linha;
  }));
}

/* Rotulo do periodo em analise, usado nos subtitulos. */
function descricaoPeriodo() {
  const ano = F.ano === "todos" ? "2025–2026" : F.ano;
  if (!F.meses.size) return ano;
  const meses = [...F.meses].sort((a, b) => a - b)
    .map(m => ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][m - 1]);
  return meses.join(", ") + " · " + ano;
}
const temAnoAnterior = () => F.ano !== "todos" && M.anos.includes(Number(F.ano) - 1);

/* ====================================================================
   8. PAGINA 3 - DECOMPOSICAO
   ==================================================================== */

const DIMENSOES = [
  { id: "vendedor",   nome: "Vendedor" },
  { id: "grupo",      nome: "Grupo de produto" },
  { id: "fornecedor", nome: "Fornecedor" },
  { id: "equipe",     nome: "Equipe" },
];
let dimWaterfall = "vendedor";
const caminhoArvore = [];   // niveis abertos na arvore de decomposicao

function nomeDe(dim, id) {
  switch (dim) {
    case "vendedor":   return M.vendedores[id].nome;
    case "grupo":      return M.grupos[id].nome;
    case "fornecedor": return M.fornecedores[id];
    case "equipe":     return M.equipes[id];
    case "linha":      return M.linhas[id];
  }
  return String(id);
}
function ttDe(dim, id) {
  if (dim === "vendedor") return ttVendedor(id);
  if (dim === "grupo") return ttGrupo(id);
  return ttSimples(nomeDe(dim, id), dim + " · " + medidaAtual().nome, serie(dim, id));
}

function paginaDecomposicao(raiz) {
  const campo = medidaAtual().campo;

  // ---- seletor de dimensao
  const seletor = criar("div", { class: "chips", style: "margin-bottom:14px" },
    DIMENSOES.map(d => criar("button", {
      class: "chip", "aria-pressed": String(dimWaterfall === d.id), text: d.nome,
      onclick: () => { dimWaterfall = d.id; renderizar(); },
    })));

  // ---- waterfall
  const atual = consultar(dimWaterfall);
  const comLY = temAnoAnterior();
  const ly = comLY ? consultar(dimWaterfall, { ly: true }) : null;

  let itens, inicio, rotIni, rotFim, explicacao;
  if (comLY) {
    const chaves = new Set([...atual.keys(), ...ly.keys()]);
    itens = [...chaves].map(id => ({
      id,
      rotulo: nomeDe(dimWaterfall, id),
      valor: ((atual.get(id) || {})[campo] || 0) - ((ly.get(id) || {})[campo] || 0),
      aoPassar: () => ttDe(dimWaterfall, id),
    })).sort((a, b) => b.valor - a.valor);
    inicio = totalDe(ly, campo);
    rotIni = String(Number(F.ano) - 1);
    rotFim = String(F.ano);
    explicacao = "Cada barra é a variação daquele item entre " + rotIni + " e " + rotFim +
      ". Verde empurra o resultado para cima, vermelho puxa para baixo.";
  } else {
    itens = [...atual.entries()].map(([id, a]) => ({
      id, rotulo: nomeDe(dimWaterfall, id), valor: a[campo],
      aoPassar: () => ttDe(dimWaterfall, id),
    })).sort((a, b) => b.valor - a.valor);
    inicio = 0;
    rotIni = "zero";
    rotFim = "total";
    explicacao = "Sem ano anterior no período selecionado, então o waterfall mostra " +
      "a composição do total, e não a variação. Escolha " + M.anos[M.anos.length - 1] +
      " no filtro de ano para ver a variação contra o ano anterior.";
  }

  raiz.appendChild(cartao(
    (comLY ? "O QUE MOVEU " : "COMPOSIÇÃO DE ") + medidaAtual().nome.toUpperCase() +
    " — POR " + DIMENSOES.find(d => d.id === dimWaterfall).nome.toUpperCase(), [
      seletor,
      graficoWaterfall(itens, inicio, rotIni, rotFim),
      criar("div", { class: "nota", text: explicacao }),
    ]));

  // ---- treemap + arvore
  const grp = [...consultar("grupo").entries()]
    .map(([id, a]) => ({ id, valor: a[campo], rotulo: M.grupos[id].nome }))
    .filter(i => i.valor > 0)
    .sort((a, b) => b.valor - a.valor);

  raiz.appendChild(criar("div", { class: "grade g-2b", style: "margin-top:16px" }, [
    cartao("TREEMAP POR GRUPO DE PRODUTO", [
      graficoTreemap(grp, it => ttGrupo(it.id)),
      criar("div", { class: "nota", text:
        "Área proporcional a " + medidaAtual().nome.toLowerCase() + " no período." }),
    ]),
    cartao("ÁRVORE DE DECOMPOSIÇÃO", [arvoreDecomposicao()]),
  ]));
}

/* Arvore de decomposicao: abre um nivel por vez, sempre pelo maior
   item, e o caminho aberto fica clicavel para voltar. E a versao HTML
   do visual "arvore de decomposicao" do Power BI.                    */
const NIVEIS_ARVORE = ["linha", "fornecedor", "grupo", "vendedor"];

function arvoreDecomposicao() {
  const campo = medidaAtual().campo;
  const caixa = criar("div", {});

  // trilha do caminho aberto
  if (caminhoArvore.length) {
    caixa.appendChild(criar("div", { class: "chips", style: "margin-bottom:10px" },
      [criar("button", { class: "chip", text: "↺ tudo",
        onclick: () => { caminhoArvore.length = 0; renderizar(); } })].concat(
        caminhoArvore.map((n, i) => criar("button", {
          class: "chip", "aria-pressed": "true",
          text: nomeDe(n.dim, n.id),
          onclick: () => { caminhoArvore.length = i; renderizar(); },
        })))));
  }

  // filtros acumulados do caminho
  let grupos = gruposSelecionados();
  let vendedor;
  for (const n of caminhoArvore) {
    if (n.dim === "linha")
      grupos = grupos.filter(g => M.linhaDoGrupo[g] === M.linhas[n.id]);
    else if (n.dim === "fornecedor")
      grupos = grupos.filter(g => M.fornecedorDoGrupo[g] === M.fornecedores[n.id]);
    else if (n.dim === "grupo")
      grupos = grupos.filter(g => g === n.id);
    else if (n.dim === "vendedor") vendedor = n.id;
  }

  const nivel = NIVEIS_ARVORE[caminhoArvore.length];
  if (!nivel) {
    caixa.appendChild(criar("div", { class: "vazio",
      text: "Último nível alcançado. Clique em um item da trilha para voltar." }));
    return caixa;
  }

  const mapa = consultar(nivel, { grupos, vendedor });
  const itens = [...mapa.entries()]
    .map(([id, a]) => ({ id, valor: a[campo], rotulo: nomeDe(nivel, id) }))
    .filter(i => i.valor > 0)
    .sort((a, b) => b.valor - a.valor)
    .slice(0, 8);

  if (!itens.length) {
    caixa.appendChild(criar("div", { class: "vazio", text: "Nada neste recorte." }));
    return caixa;
  }

  caixa.appendChild(criar("div", { class: "nota",
    style: "margin:0 0 8px", text: "Abrindo por " + nivel + " — clique para descer um nível." }));

  const max = Math.max(...itens.map(i => i.valor));
  caixa.appendChild(criar("div", { class: "ranking" }, itens.map(it => {
    const linha = criar("div", { class: "linha-rank", style: "cursor:pointer",
      onclick: () => { caminhoArvore.push({ dim: nivel, id: it.id }); renderizar(); } }, [
      criar("div", { class: "pos", text: "›" }),
      criar("div", {}),
      criar("div", {}, [
        criar("div", { class: "nome", text: it.rotulo }),
        criar("div", { class: "barra-fundo" },
          [criar("i", { style: "width:" + (it.valor / max * 100) + "%" })]),
      ]),
      criar("div", { class: "num", text: compacto(it.valor) }),
    ]);
    TT.ligar(linha, () => ttDe(nivel, it.id));
    return linha;
  })));
  return caixa;
}

/* ====================================================================
   9. PAGINA 4 - KEY RESULTS (metas vs. realizado)
   ==================================================================== */

function metaDoVendedor(id, periodos) {
  const bloco = D.metas[String(id)];
  if (!bloco) return 0;
  let s = 0;
  for (const p of periodos) s += bloco[String(p)] || 0;
  return s;
}

function statusAtingimento(pct) {
  if (pct === null) return { classe: "st-abaixo", texto: "sem meta" };
  if (pct >= 1)    return { classe: "st-ok",      texto: "atingida" };
  if (pct >= 0.9)  return { classe: "st-atencao", texto: "quase lá" };
  return { classe: "st-abaixo", texto: "abaixo" };
}

function paginaKeyResults(raiz) {
  // A meta so existe para faturamento e so a partir do segundo ano da
  // base - e derivada do realizado do ano anterior. Por isso o realizado
  // desta pagina e medido SO nos periodos que tem meta: comparar dois
  // anos de venda contra um ano de meta daria um atingimento inflado
  // (com o filtro em "todos", dava 189%).
  const temMeta = p => Object.values(D.metas).some(b => b[String(p)] !== undefined);
  const pTodos = periodosSelecionados(false);
  const pSel = pTodos.filter(temMeta);
  const anoSemMeta = pSel.length === 0;
  const recortado = pSel.length < pTodos.length;

  raiz.appendChild(criar("div", { class: "aviso", text:
    "Meta sintética: não existe meta nas bases de origem. Ela é derivada em " +
    "dw.meta_vendedor_mes como o faturamento do mesmo mês do ano anterior × " +
    "(1 + " + Math.round(D.meta.percentual_meta * 100) + "%). Por isso só há meta " +
    "a partir de " + (M.anos[0] + 1) + ", e sempre sobre faturamento — não sobre margem." }));

  if (F.linha !== "T") {
    raiz.appendChild(criar("div", { class: "aviso", text:
      "Filtro de linha de produto ativo (" + F.linha + "): o realizado abaixo está " +
      "filtrado, mas a meta é do vendedor no total. Limpe o filtro de linha para " +
      "comparar maçã com maçã." }));
  }

  if (anoSemMeta) {
    raiz.appendChild(criar("div", { class: "vazio", text:
      "Nenhuma meta no período selecionado. Escolha " + M.anos[M.anos.length - 1] +
      " no filtro de ano." }));
    return;
  }

  if (recortado) {
    raiz.appendChild(criar("div", { class: "aviso", text:
      "O período selecionado inclui meses sem meta. Para a comparação ficar " +
      "honesta, o realizado abaixo considera apenas os " + pSel.length +
      " meses que têm meta (" + M.rotulos[pSel[0]] + " a " +
      M.rotulos[pSel[pSel.length - 1]] + ")." }));
  }

  const atual = consultar("vendedor", { periodos: pSel });
  const linhas = M.vendedores.map((v, id) => {
    const realizado = (atual.get(id) || { fat: 0 }).fat;
    const meta = metaDoVendedor(id, pSel);
    return {
      id, nome: v.nome, equipe: v.equipe, foto: v.foto,
      realizado, meta, gap: realizado - meta,
      pct: meta ? realizado / meta : null,
    };
  }).sort((a, b) => (b.pct || -1) - (a.pct || -1));

  const metaTotal = linhas.reduce((a, b) => a + b.meta, 0);
  const realTotal = linhas.reduce((a, b) => a + b.realizado, 0);
  const pctTotal = metaTotal ? realTotal / metaTotal : null;
  const st = statusAtingimento(pctTotal);
  const atingiram = linhas.filter(l => l.pct !== null && l.pct >= 1).length;

  raiz.appendChild(criar("div", { class: "grade g-kpis" }, [
    criar("div", { class: "cartao kpi" }, [
      criar("div", { class: "rotulo", text: "Meta do período" }),
      criar("div", { class: "valor", text: fmtMoeda.format(metaTotal) }),
      criar("div", { class: "rodape" }, [criar("span", { text: descricaoPeriodo() })]),
    ]),
    criar("div", { class: "cartao kpi" }, [
      criar("div", { class: "rotulo", text: "Realizado" }),
      criar("div", { class: "valor", text: fmtMoeda.format(realTotal) }),
      criar("div", { class: "rodape" }, [
        criar("span", { class: "var " + (realTotal >= metaTotal ? "sobe" : "desce"),
          text: (realTotal >= metaTotal ? "+" : "") + compacto(realTotal - metaTotal) }),
        criar("span", { text: "contra a meta" }),
      ]),
    ]),
    criar("div", { class: "cartao kpi" }, [
      criar("div", { class: "rotulo", text: "Atingimento" }),
      criar("div", { class: "valor", text: pctTotal === null ? "—" : fmtPct1.format(pctTotal) }),
      criar("div", { class: "rodape" }, [
        criar("span", { class: "pastilha " + st.classe },
          [criar("i", {}), document.createTextNode(st.texto)]),
        criar("span", { text: atingiram + " de " + linhas.length + " vendedores na meta" }),
      ]),
    ]),
  ]));

  // ---- meta x realizado mes a mes
  const porPeriodo = consultar("periodo", { periodos: pSel });
  const realMes = pSel.map(p => (porPeriodo.get(p) || {}).fat || 0);
  const metaMes = pSel.map(p =>
    M.vendedores.reduce((a, _, id) => a + metaDoVendedor(id, [p]), 0));

  raiz.appendChild(criar("div", { style: "margin-top:16px" }, [
    cartao("REALIZADO CONTRA META, MÊS A MÊS", [
      graficoCombo({
        rotulos: pSel.map(p => M.rotulos[p]),
        colunas: realMes,
        linha: metaMes,
        aoPassar: i => ttSimples(M.rotulos[pSel[i]], "Faturamento no mês", realMes, [
          { rotulo: "meta", valor: compacto(metaMes[i]) },
          { rotulo: "atingimento",
            valor: metaMes[i] ? fmtPct1.format(realMes[i] / metaMes[i]) : "—" },
        ], { rotulos: pSel.map(p => M.rotulos[p]), total: realMes[i] }),
      }),
      criar("div", { class: "nota", text:
        "Colunas: faturamento realizado. Linha tracejada: meta do mês." }),
    ]),
  ]));

  // ---- tabela por vendedor com bullet e semaforo
  const corpo = criar("tbody", {}, linhas.map(l => {
    const s = statusAtingimento(l.pct);
    const corBullet = l.pct === null ? cor("--texto-3")
              : l.pct >= 1 ? cor("--positivo")
              : l.pct >= 0.9 ? cor("--alerta") : cor("--negativo");
    const tr = criar("tr", {}, [
      criar("td", { text: l.nome }),
      criar("td", { text: l.equipe }),
      criar("td", { text: fmtMoeda.format(l.meta) }),
      criar("td", { text: fmtMoeda.format(l.realizado) }),
      criar("td", {}, [criar("span", { class: "var " + (l.gap >= 0 ? "sobe" : "desce"),
        text: (l.gap >= 0 ? "+" : "") + compacto(l.gap) })]),
      criar("td", { text: l.pct === null ? "—" : fmtPct1.format(l.pct) }),
      criar("td", { style: "width:250px" }, [graficoBullet(l.realizado, l.meta, corBullet)]),
      criar("td", {}, [criar("span", { class: "pastilha " + s.classe },
        [criar("i", {}), document.createTextNode(s.texto)])]),
    ]);
    TT.ligar(tr, () => ttVendedor(l.id));
    return tr;
  }));

  raiz.appendChild(criar("div", { style: "margin-top:16px" }, [
    cartao("METAS POR VENDEDOR — " + descricaoPeriodo(), [
      criar("div", { class: "rolagem" }, [
        criar("table", {}, [
          criar("thead", {}, [criar("tr", {}, [
            criar("th", { text: "Vendedor" }), criar("th", { text: "Equipe" }),
            criar("th", { text: "Meta" }), criar("th", { text: "Realizado" }),
            criar("th", { text: "Gap" }), criar("th", { text: "Atingimento" }),
            criar("th", { text: "Realizado × meta" }), criar("th", { text: "Status" }),
          ])]),
          corpo,
        ]),
      ]),
      criar("div", { class: "nota", text:
        "A marca clara no gráfico é a meta; a barra é o realizado. " +
        "Verde ≥ 100%, amarelo entre 90% e 100%, vermelho abaixo de 90%." }),
    ]),
  ]));
}

/* ====================================================================
   10. FILTROS E RENDER
   ==================================================================== */

function montarFiltros() {
  const anos = $("#f-ano");
  anos.textContent = "";
  [["todos", "Todos"]].concat(M.anos.map(a => [String(a), String(a)]))
    .forEach(([v, r]) => anos.appendChild(criar("button", {
      class: "chip", text: r, "aria-pressed": String(F.ano === v),
      onclick: () => { F.ano = v; renderizar(); },
    })));

  const meses = $("#f-mes");
  meses.textContent = "";
  ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"]
    .forEach((r, i) => meses.appendChild(criar("button", {
      class: "chip mes", text: r, "aria-pressed": String(F.meses.has(i + 1)),
      onclick: () => {
        F.meses.has(i + 1) ? F.meses.delete(i + 1) : F.meses.add(i + 1);
        renderizar();
      },
    })));

  const linhas = $("#f-linha");
  linhas.textContent = "";
  [["T", "Todas"]].concat(M.linhas.map(l => [l, l]))
    .forEach(([v, r]) => linhas.appendChild(criar("button", {
      class: "chip", text: r, "aria-pressed": String(F.linha === v),
      onclick: () => { F.linha = v; renderizar(); },
    })));

  // Equivalente ao parametro de campo auxAnalise do modelo.
  const med = $("#f-medida");
  med.textContent = "";
  MEDIDAS.forEach(m => med.appendChild(criar("button", {
    class: "chip", text: m.nome, "aria-pressed": String(F.medida === m.id),
    onclick: () => { F.medida = m.id; renderizar(); },
  })));
}

function atualizarPressionados() {
  $("#f-ano").querySelectorAll("button").forEach((b, i) =>
    b.setAttribute("aria-pressed", String(F.ano === (i === 0 ? "todos" : String(M.anos[i - 1])))));
  $("#f-mes").querySelectorAll("button").forEach((b, i) =>
    b.setAttribute("aria-pressed", String(F.meses.has(i + 1))));
  $("#f-linha").querySelectorAll("button").forEach((b, i) =>
    b.setAttribute("aria-pressed", String(F.linha === (i === 0 ? "T" : M.linhas[i - 1]))));
  $("#f-medida").querySelectorAll("button").forEach((b, i) =>
    b.setAttribute("aria-pressed", String(F.medida === i)));
}

const PAGINAS = {
  home:   { alvo: "#pg-home",   render: paginaHome },
  perf:   { alvo: "#pg-perf",   render: paginaPerformance },
  decomp: { alvo: "#pg-decomp", render: paginaDecomposicao },
  kr:     { alvo: "#pg-kr",     render: paginaKeyResults },
};

function renderizar() {
  TT.esconder();
  atualizarPressionados();

  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.pagina === F.pagina)));
  document.querySelectorAll('section[role="tabpanel"]').forEach(s =>
    s.classList.toggle("ativa", s.id === PAGINAS[F.pagina].alvo.slice(1)));

  const raiz = $(PAGINAS[F.pagina].alvo);
  raiz.textContent = "";
  PAGINAS[F.pagina].render(raiz);

  $("#sub-periodo").textContent =
    descricaoPeriodo() + " · " + medidaAtual().nome +
    (F.linha === "T" ? "" : " · " + F.linha);
}

function arrancar() {
  prepararModelo();
  TT.el = $("#tooltip");

  // O tema entra antes do primeiro render: os graficos leem as cores do
  // tema em vigor no momento em que sao desenhados.
  TEMA.iniciar();
  $("#btn-tema").addEventListener("click", TEMA.alternar);

  // Abre no ano mais recente: e o unico com ano anterior para comparar,
  // entao os KPIs de variacao ja fazem sentido na primeira tela.
  F.ano = String(M.anos[M.anos.length - 1]);

  montarFiltros();

  document.querySelectorAll("nav button").forEach(b =>
    b.addEventListener("click", () => { F.pagina = b.dataset.pagina; renderizar(); }));

  $("#btn-limpar").addEventListener("click", () => {
    F.ano = String(M.anos[M.anos.length - 1]);
    F.meses.clear(); F.linha = "T"; F.medida = 0;
    caminhoArvore.length = 0;
    renderizar();
  });

  const nomeFonte = { sqlserver: "SQL Server VendasPBI, schema dw",
                      postgres: "PostgreSQL vendas_pbi, schema dw",
                      csv: "CSVs de db/csv" }[D.meta.fonte] || D.meta.fonte;

  $("#rodape").textContent =
    "Fonte: " + nomeFonte + " (" + D.meta.linhas_origem.toLocaleString("pt-BR") +
    " linhas na fato) · JSON gerado em " + D.meta.gerado_em.slice(0, 16).replace("T", " ") +
    " a partir de " + D.meta.fonte +
    " · datas deslocadas em " + D.meta.deslocamento_anos + " anos em relação à base original" +
    " · Notas Emitidas conta NFes distintas; em seleção avulsa de meses a soma " +
    "superestima em ~0,04% (48 de 119.301 notas aparecem em mais de um mês).";

  renderizar();
}

iniciar();
</script>
